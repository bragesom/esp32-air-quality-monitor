; PlatformIO Project Configuration File
; ESP32 Air Quality Monitor (Theia / AQ-Meter Pro)

[env:esp32_3mb]
; Pinned platform — 6.11.0 is the version this project is known to build with.
platform        = espressif32@6.11.0
board           = esp32doit-devkit-v1
framework       = arduino
upload_speed    = 921600
monitor_speed   = 115200

; 4MB flash: ~2MB app + ~2MB SPIFFS (see partitions_3mb.csv)
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash    = 80000000L
board_build.partitions = partitions_3mb.csv

; Build flags (Os + section GC for size; ArduinoJson trimmed; no OLED splash)
build_flags =
    -Os                                      ; Size optimization
    -ffunction-sections                      ; Enable function sections
    -fdata-sections                          ; Enable data sections
    -Wl,--gc-sections                        ; Garbage collect unused sections
    -D CONFIG_LITTLEFS_MAX_PARTITION_LABEL_LEN=16
    -D AsyncTCP_BUFFER_SIZE=2048             ; Larger TCP buffer for file uploads
    -D CORE_DEBUG_LEVEL=1                    ; Minimal debug output
    -D CONFIG_FREERTOS_HZ=1000               ; 1ms tick rate
    -D ARDUINOJSON_USE_LONG_LONG=0           ; Disable 64-bit integers
    -D ARDUINOJSON_ENABLE_COMMENTS=0         ; No JSON comments
    -D ARDUINOJSON_USE_DOUBLE=0              ; Use float instead of double
    -D ARDUINOJSON_DECODE_UNICODE=0          ; No Unicode decoding
    -D SSD1306_NO_SPLASH=1                   ; No Adafruit splash
    -D ASYNC_WEB_SERVER_REGEX=1              ; Enable regex support
    -D WS_MAX_QUEUED_MESSAGES=8              ; WebSocket message queue

; Libraries — pinned to exact versions for reproducible builds.
; NOTE: the async stack moved from the now-archived me-no-dev repos to the
; actively-maintained ESP32Async org (published to the PlatformIO registry).
; Bare git URLs to the archived repos would track a moving HEAD, so we pin
; owner/name@version instead. ESPAsyncWebServer 3.6.0 == commit ad3741d1.
lib_deps =
    adafruit/Adafruit SSD1306@2.5.14
    adafruit/Adafruit GFX Library@1.12.1
    adafruit/Adafruit BusIO@1.17.1
    sparkfun/SparkFun SCD30 Arduino Library@1.0.20
    ESP32Async/AsyncTCP@3.4.4
    ESP32Async/ESPAsyncWebServer@3.6.0
    bblanchon/ArduinoJson@7.4.1

; File system settings
board_build.filesystem = spiffs
extra_scripts = pre:compress_web_files.py
